[package]
name = "consilium-workflow"
version = "0.1.0"
edition = "2021"
[dependencies]
consilium-domain.workspace = true
consilium-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait = "0.1"
sha2 = "0.10"
jsonschema = "0.29"
tempfile = "3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
[dev-dependencies]
tempfile = "3"
